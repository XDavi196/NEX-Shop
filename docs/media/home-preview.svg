<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Prévia ilustrativa da NEX Shop</title>
  <desc id="desc">Interface ilustrativa da página inicial da NEX Shop, com pesquisa, categorias e cartões do catálogo.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#20202b"/><stop offset=".55" stop-color="#101116"/></linearGradient><linearGradient id="accent"><stop stop-color="#e93449"/><stop offset="1" stop-color="#f04b5f"/></linearGradient></defs>
  <rect width="1440" height="1000" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#f5f5f7">
    <rect x="120" y="44" width="1200" height="1" fill="#ffffff24"/>
    <g transform="translate(126 58) scale(.078)"><rect width="512" height="512" rx="112" fill="#101116"/><path d="M130 380V132h57l138 158V132h57v248h-53L187 215v165z" fill="#74f0c3"/><circle cx="380" cy="382" r="24" fill="#74f0c3"/></g>
    <text x="184" y="94" font-size="26" font-weight="800" letter-spacing="5">NEX <tspan fill="#74f0c3">SHOP</tspan></text><text x="1118" y="91" font-size="16" fill="#ff7c88">GitHub oficial ↗</text>
    <rect x="895" y="112" width="425" height="54" rx="15" fill="#1d1e28" stroke="#ffffff30"/><text x="918" y="145" font-size="13" fill="#aaaab8">ESTILO</text><rect x="988" y="122" width="143" height="34" rx="10" fill="#292a35" stroke="#74f0c3"/><text x="1059" y="144" text-anchor="middle" font-size="13">Moderno · Switch 2</text><rect x="1141" y="122" width="161" height="34" rx="10" fill="#292a35" stroke="#ffffff28"/><text x="1221" y="144" text-anchor="middle" font-size="13">Retrô · Wii U eShop</text>
    <text x="126" y="205" font-size="54" font-weight="800">Projetos para <tspan fill="#f04b5f">jogar e criar.</tspan></text><text x="128" y="246" font-size="18" fill="#b6b6bf">Consulte projetos e releases públicos nas plataformas oficiais.</text>
    <rect x="126" y="286" width="158" height="48" rx="9" fill="url(#accent)"/><text x="205" y="316" text-anchor="middle" font-size="16" font-weight="700">Catálogo</text><rect x="296" y="286" width="232" height="48" rx="9" fill="#24252d" stroke="#ffffff30"/><text x="412" y="316" text-anchor="middle" font-size="16">Buscar em plataformas</text>
    <g font-size="15"><rect x="126" y="356" width="96" height="42" rx="8" fill="url(#accent)"/><text x="174" y="383" text-anchor="middle">Todos</text><rect x="234" y="356" width="142" height="42" rx="8" fill="#24252d" stroke="#ffffff30"/><text x="305" y="383" text-anchor="middle">Homebrews</text><rect x="388" y="356" width="146" height="42" rx="8" fill="#24252d" stroke="#ffffff30"/><text x="461" y="383" text-anchor="middle">Emuladores</text><rect x="546" y="356" width="182" height="42" rx="8" fill="#24252d" stroke="#ffffff30"/><text x="637" y="383" text-anchor="middle">Ports e recomps</text></g>
    <rect x="126" y="425" width="1194" height="58" rx="10" fill="#1b1c23" stroke="#ffffff30"/><text x="150" y="461" font-size="16" fill="#92929e">Filtrar projetos do catálogo…</text>
    <text x="128" y="524" font-size="15" fill="#b6b6bf">Projetos selecionados manualmente · confirme requisitos e releases nas fontes oficiais.</text>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#f5f5f7">
    <g transform="translate(126 553)"><rect width="380" height="300" rx="16" fill="#1c1d24" stroke="#ffffff20"/><text x="24" y="38" font-size="13" fill="#b6b6bf">EMULADOR · GITHUB · WINDOWS / ANDROID</text><text x="24" y="82" font-size="25" font-weight="700">PPSSPP</text><text x="24" y="119" font-size="16" fill="#b6b6bf">Emulador de PSP. Confira requisitos</text><text x="24" y="145" font-size="16" fill="#b6b6bf">e arquivos na página oficial.</text><rect x="24" y="222" width="174" height="44" rx="8" fill="#292a34" stroke="#ffffff30"/><text x="111" y="250" text-anchor="middle" font-size="14">Ver versões oficiais</text><text x="215" y="250" font-size="14" fill="#ff7c88">Repositório ↗</text></g>
    <g transform="translate(530 553)"><rect width="380" height="300" rx="16" fill="#1c1d24" stroke="#ffffff20"/><text x="24" y="38" font-size="13" fill="#b6b6bf">EMULADOR · GITHUB · WINDOWS</text><text x="24" y="82" font-size="25" font-weight="700">melonDS</text><text x="24" y="119" font-size="16" fill="#b6b6bf">Emulador de Nintendo DS.</text><text x="24" y="145" font-size="16" fill="#b6b6bf">Firmware e jogos não são fornecidos.</text><rect x="24" y="222" width="174" height="44" rx="8" fill="#292a34" stroke="#ffffff30"/><text x="111" y="250" text-anchor="middle" font-size="14">Ver versões oficiais</text><text x="215" y="250" font-size="14" fill="#ff7c88">Repositório ↗</text></g>
    <g transform="translate(934 553)"><rect width="386" height="300" rx="16" fill="#1c1d24" stroke="#ffffff20"/><text x="24" y="38" font-size="13" fill="#b6b6bf">FRONTEND · GITHUB · WINDOWS / ANDROID</text><text x="24" y="82" font-size="25" font-weight="700">RetroArch</text><text x="24" y="119" font-size="16" fill="#b6b6bf">Frontend para emuladores. Núcleos</text><text x="24" y="145" font-size="16" fill="#b6b6bf">podem ter licenças diferentes.</text><rect x="24" y="222" width="174" height="44" rx="8" fill="#292a34" stroke="#ffffff30"/><text x="111" y="250" text-anchor="middle" font-size="14">Ver versões oficiais</text><text x="215" y="250" font-size="14" fill="#ff7c88">Repositório ↗</text></g>
  </g>
  <text x="720" y="934" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#9999a5">Prévia ilustrativa da home · estilo e cor selecionáveis · catálogo inicial com cinco emuladores</text>
</svg>
