name: Build and release NEX Shop
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri icon src-tauri/icons/app-icon.svg
      - run: pnpm tauri build --bundles nsis
      - name: Name the installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $installer.FullName NEX-Shop-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: NEX-Shop-Setup.exe
          if-no-files-found: error
  android:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec cap add android
      - run: pnpm exec cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NEX-Shop-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: NEX-Shop-Android-debug.apk
          if-no-files-found: error
  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish release with both installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: NEX Shop v0.2.0
          target_commitish: main
          prerelease: true
          generate_release_notes: true
          body: |
            Builds de teste da NEX Shop para Windows e Android.

            - Windows: instalador NSIS não assinado.
            - Android: APK debug, sem assinatura para publicação na Play Store.
          files: |
            release-assets/windows-installer/NEX-Shop-Setup.exe
            release-assets/android-apk/NEX-Shop-Android-debug.apk
