name: Build and release NEX Shop
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
  windows:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri icon src-tauri/icons/app-icon.svg
      - run: pnpm tauri build --bundles nsis
      - name: Name the installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Tauri did not produce an NSIS installer.' }
          Copy-Item $installer.FullName NEX-Shop-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: NEX-Shop-Setup.exe
          if-no-files-found: error
  android:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec cap add android
      - run: pnpm exec cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NEX-Shop-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: NEX-Shop-Android-debug.apk
          if-no-files-found: error
  release:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish preview with verified builds
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0
          name: NEX Shop v0.4.0 — Prévia Windows e Android
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          body: |
            Prévia de desenvolvimento da NEX Shop compilada a partir do commit executado neste workflow.

            ## Artefatos
            - `NEX-Shop-Setup.exe`: instalador NSIS Windows, sem assinatura digital.
            - `NEX-Shop-Android-debug.apk`: APK de depuração, sem assinatura para publicação na Play Store.

            ## Escopo e limitações
            Esta versão inclui estilos de interface moderno e retrô, cores selecionáveis e pesquisa de repositórios e releases públicos do GitHub e GitLab. Ela abre links oficiais no navegador, mas não gerencia downloads nem instala, atualiza, repara ou desinstala aplicativos. Consulte o README para as limitações completas.

            Use os artefatos de prévia por sua conta e confirme a origem antes de instalar.
          files: |
            release-assets/windows-installer/NEX-Shop-Setup.exe
            release-assets/android-apk/NEX-Shop-Android-debug.apk

